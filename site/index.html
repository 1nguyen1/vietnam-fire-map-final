<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bản đồ cháy rừng</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="lib/d3.min.js"></script>
<script src="lib/topojson-client.min.js"></script>
<style>
:root{--beige:230,213,176;--ink:#e6d5b0;--dim:rgba(230,213,176,.62);--line:rgba(230,213,176,.16);--glass:rgba(9,17,44,.66);--hot:#f08a34}
*{box-sizing:border-box}
#methBtn{display:none !important}
html,body{height:100%;margin:0}
body{overflow:hidden;background:radial-gradient(120% 90% at 50% 0%,#10204a 0%,#0a1433 45%,#060b20 100%);color:var(--ink);font-family:"Be Vietnam Pro",system-ui,sans-serif;font-size:14px;-webkit-font-smoothing:antialiased}
body.terrain{--glass:rgba(9,17,44,.84);--line:rgba(230,213,176,.24)}
a{color:var(--ink)}a:hover{color:#fff}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#stars,#terrain{pointer-events:none;transform-origin:0 0}
#heat{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .5s ease;transform-origin:0 0}
body.vn #heat{opacity:1;transition:opacity .9s ease .1s}
.hl{transition:opacity .95s ease,transform .95s cubic-bezier(.2,.7,.2,1);will-change:opacity,transform}
.hl.pre{opacity:0;transform:translateY(16px) scale(1.025)}
.hl.on{opacity:1;transform:none}
.hl.out{opacity:0;transform:translateY(-10px) scale(.985)}
#map{cursor:grab;touch-action:none}
#map.grabbing{cursor:grabbing}#map.point{cursor:pointer}
body.vn #map{cursor:default}body.vn #map.point{cursor:pointer}body.vn #map.grabbing{cursor:grabbing}
button,select{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace}
header{position:absolute;left:0;right:0;top:0;padding:18px 20px;display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;pointer-events:none;z-index:4}
header>*{pointer-events:auto}
.brand{display:flex;align-items:center;gap:10px;font-weight:500;letter-spacing:.01em}
.brand i{width:8px;height:8px;border-radius:50%;background:var(--hot);box-shadow:0 0 12px 2px rgba(240,138,52,.7)}
.grow{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 13px;border:1px solid var(--line);border-radius:999px;background:var(--glass);backdrop-filter:blur(10px);color:var(--ink);white-space:nowrap;transition:background .2s,border-color .2s}
.pill:hover{background:rgba(230,213,176,.14);border-color:rgba(230,213,176,.38)}
.pill.act{background:rgba(240,138,52,.22);border-color:rgba(240,138,52,.65);color:#fff3da}
.seg{display:inline-flex;gap:2px;padding:3px;border:1px solid var(--line);border-radius:999px;background:var(--glass);backdrop-filter:blur(10px)}
.seg button{height:28px;padding:0 12px;border-radius:999px;color:var(--dim);white-space:nowrap;transition:background .25s,color .25s}
.seg button:hover{color:var(--ink)}
.seg button.act{background:rgba(230,213,176,.18);color:#fff3da}
.vnonly{opacity:0;visibility:hidden;transform:translateY(8px);transition:opacity .5s ease,transform .5s ease,visibility 0s .5s}
body.vn .vnonly{opacity:1;visibility:visible;transform:none;transition:opacity .7s ease .15s,transform .7s ease .15s}
#fit{position:absolute;left:20px;top:70px;opacity:0;pointer-events:none;transition:opacity .3s,background .2s,border-color .2s;z-index:4}
body.vn #fit.show{opacity:1;pointer-events:auto}
#hint{position:absolute;left:50%;top:76px;transform:translateX(-50%);text-align:center;color:var(--dim);pointer-events:none;transition:opacity .5s;width:min(90%,520px);line-height:1.5;z-index:3}
#hint b{display:block;font-weight:300;font-size:clamp(22px,3.2vw,34px);color:var(--ink);letter-spacing:-.01em;margin-bottom:6px;text-wrap:balance}
body:not(.globe) #hint{opacity:0}
#vnChip{position:absolute;left:0;top:0;height:32px;padding:0 12px 0 10px;border-radius:999px;border:1px solid rgba(255,190,120,.55);background:rgba(20,16,30,.78);backdrop-filter:blur(8px);color:#ffe9c6;display:flex;align-items:center;gap:8px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .35s;z-index:4}
#vnChip i{width:6px;height:6px;border-radius:50%;background:var(--hot)}
#vnChip.show{opacity:1;pointer-events:auto}
body:not(.globe) #vnChip{opacity:0;pointer-events:none}

/* Patrol button right between #styles (top:18px) and #panel (top:104px) */
#patrolBtn{position:absolute;right:20px;top:60px;z-index:4}

#panel{position:absolute;right:20px;top:104px;width:306px;padding:18px;border:1px solid var(--line);border-radius:16px;background:var(--glass);backdrop-filter:blur(12px);z-index:4;max-height:calc(100vh - 180px);display:flex;flex-direction:column}
.lab{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--dim)}
#total{font-size:42px;font-weight:300;line-height:1.1;margin:6px 0 2px;color:#fff3da;letter-spacing:-.02em}
#period2{color:var(--dim);font-size:12px;line-height:1.5}
#top{margin-top:16px;padding-top:14px;border-top:1px solid var(--line);display:grid;gap:10px;overflow-y:auto;padding-right:2px}
#top::-webkit-scrollbar{width:4px}
#top::-webkit-scrollbar-thumb{background:rgba(230,213,176,.22);border-radius:4px}
.row{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:4px 8px;align-items:baseline}
.row .n{color:var(--dim);font-size:11px}
.row .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .v{font-size:12px;color:#fff3da}
.row .bar{grid-column:2/4;height:3px;border-radius:2px;background:rgba(230,213,176,.1);overflow:hidden}
.row .bar s{display:block;height:100%;width:0;border-radius:2px;transition:width .7s cubic-bezier(.2,.7,.2,1),background .7s}
#topMore{margin-top:10px;align-self:flex-start;font-size:12px;color:var(--ink);padding:5px 11px;border:1px solid var(--line);border-radius:999px;background:rgba(230,213,176,.06);transition:background .2s}
#topMore:hover{background:rgba(230,213,176,.16)}

/* Patrol panel inside #panel */
#fireBox{display:flex;flex-direction:column;min-height:0;overflow:hidden}
#patrolBox{display:none;flex-direction:column;gap:12px;overflow-y:auto}
body.patrol #fireBox{display:none}
body.patrol #patrolBox{display:flex}
.psel{width:100%;height:34px;padding:0 10px;border:1px solid var(--line);border-radius:10px;background:rgba(9,17,44,.75);color:#fff3da;font-size:13px}
.pmonths{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
.pmonths button{height:28px;border-radius:7px;border:1px solid var(--line);font-size:12px;color:var(--dim);transition:background .15s,color .15s}
.pmonths button:hover{background:rgba(230,213,176,.12);color:var(--ink)}
.pmonths button.act{background:var(--ink);color:#0a1433;font-weight:500;border-color:transparent}
.pchk{display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer;user-select:none}
.pchk input{accent-color:#e22b2b;width:15px;height:15px;cursor:pointer}
.pstats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.pstat{padding:8px;border:1px solid var(--line);border-radius:10px;background:rgba(230,213,176,.04);text-align:center}
.pstat b{display:block;font-size:16px;font-weight:500;margin-bottom:2px}
.pstat span{font-size:11px;color:var(--dim)}
.pempty{font-size:12px;color:#ffc98a;line-height:1.45;padding:8px 10px;border:1px solid rgba(255,201,138,.25);border-radius:10px;background:rgba(255,201,138,.06)}
#patrolCard{padding:11px 12px;border:1px solid rgba(230,213,176,.26);border-radius:12px;background:rgba(9,17,44,.78);font-size:12px;line-height:1.5;display:none;gap:8px;flex-direction:column}
#patrolCard.show{display:flex}
.dirbtn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:32px;padding:0 12px;border-radius:999px;background:var(--ink);color:#0a1433;font-weight:500;text-decoration:none;font-size:12px}
.dirbtn:hover{background:#fff;color:#0a1433}

/* Vertical Legend on Left */
#legend{position:absolute;left:20px;top:50%;transform:translateY(-50%);z-index:4;display:flex;flex-direction:column;gap:8px;padding:12px 11px;border:1px solid var(--line);border-radius:14px;background:var(--glass);backdrop-filter:blur(10px)}
body.vn #legend{transform:translateY(-50%)}
#legend .vwrap{display:flex;align-items:stretch;gap:9px}
#legend .g{width:10px;height:156px;border-radius:5px;background:linear-gradient(0deg,rgba(230,213,176,.14),#f2c063 28%,#f08a34 52%,#e2482a 76%,#a80f1d);border:1px solid rgba(230,213,176,.2)}
#legend .vt{display:flex;flex-direction:column;justify-content:space-between;font-size:11px;color:var(--dim);padding:1px 0}
#legend .vt b{display:block;color:#fff3da;font-weight:500;font-size:12px}
#legend .pleg{display:none;flex-direction:column;gap:8px;font-size:11px}
#legend .pleg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:middle}
body.patrol #legend .vwrap{display:none}
body.patrol #legend .pleg{display:flex}

/* Bottom bar */
#bar{position:absolute;left:50%;bottom:22px;translate:-50% 0;display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:8px;max-width:calc(100% - 220px);z-index:4}
#bar.vnonly{transform:translateY(8px)}
body.patrol #bar{opacity:0;pointer-events:none;visibility:hidden}
.stepper{display:inline-flex;align-items:center;gap:2px;padding:3px;border:1px solid var(--line);border-radius:999px;background:var(--glass);backdrop-filter:blur(10px)}
.stepper .ar{width:28px;height:28px;border-radius:50%;color:var(--dim)}
.stepper .ar:hover{background:rgba(230,213,176,.12);color:var(--ink)}
#plabel{height:28px;min-width:168px;padding:0 12px;border-radius:999px;color:#fff3da;font-size:13px;display:flex;align-items:center;justify-content:center;gap:8px}
#plabel:hover,#plabel.open{background:rgba(230,213,176,.14)}
#plabel u{text-decoration:none;font-size:9px;color:var(--dim);transition:transform .25s}
#plabel.open u{transform:rotate(180deg)}
#picker{position:absolute;left:50%;bottom:calc(100% + 12px);translate:-50% 0;width:min(320px,calc(100vw - 24px));padding:14px;border:1px solid rgba(230,213,176,.24);border-radius:16px;background:rgba(9,17,44,.92);backdrop-filter:blur(14px);box-shadow:0 20px 50px rgba(0,0,0,.45);opacity:0;visibility:hidden;transform:translateY(10px) scale(.98);transform-origin:50% 100%;transition:opacity .25s,transform .25s,visibility 0s .25s}
#picker.open{opacity:1;visibility:visible;transform:none;transition:opacity .25s,transform .25s}
.ph{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.ph span,.ph .pjump{font-weight:500}.ph .pjump{width:auto;height:auto;white-space:nowrap;padding:4px 12px;border-radius:999px;color:var(--ink);transition:background .15s}.ph .pjump:hover{background:rgba(230,213,176,.14)}
.ph button{width:28px;height:28px;border-radius:50%;color:var(--dim)}.ph button:hover{background:rgba(230,213,176,.12);color:var(--ink)}
.gr{display:grid;gap:4px}
.gr button{height:34px;border-radius:9px;color:var(--ink);font-size:13px;transition:background .15s}
.gr button:hover{background:rgba(230,213,176,.12)}
.gr button.act{background:var(--ink);color:#0a1433;font-weight:500}
.gr button:disabled{opacity:.25;pointer-events:none}
.gr.d button,.gr.y button{height:30px;font-size:12px}
.gr .wd{font-size:10px;color:var(--dim);text-align:center;padding:2px 0 4px;text-transform:uppercase;letter-spacing:.06em}
.sub{margin:12px 0 8px}
.gr button small{display:block;font-size:9px;line-height:1;margin-top:1px;color:#ffc98a}
.gr button.act small{color:#7a2a10}
.gr button.z{color:rgba(230,213,176,.34)}

/* Settings button & popover at bottom right */
#settingsWrap{position:absolute;right:20px;bottom:22px;z-index:6}
#settingsPop{position:absolute;right:0;bottom:calc(100% + 10px);width:264px;padding:14px;border:1px solid rgba(230,213,176,.26);border-radius:16px;background:rgba(9,17,44,.94);backdrop-filter:blur(14px);box-shadow:0 20px 50px rgba(0,0,0,.5);display:none;flex-direction:column;gap:12px}
#settingsPop.open{display:flex}
.setGrp{display:flex;flex-direction:column;gap:6px}
.setGrp .seg{width:100%;justify-content:space-between}
.setGrp .seg button{flex:1;text-align:center;font-size:12px;padding:0 8px}

#tip .pt{display:block;font-size:12px;color:var(--ink);margin-top:3px}
#tip{position:absolute;left:0;top:0;padding:9px 12px;border-radius:10px;border:1px solid rgba(230,213,176,.28);background:rgba(9,17,44,.94);pointer-events:none;opacity:0;transition:opacity .15s;max-width:320px;z-index:7}
#tip b{font-weight:500;display:block;margin-bottom:2px}
#tip span{color:var(--dim);font-size:12px}
#tip em{font-style:normal;color:#ffc98a}
#loading{position:absolute;left:50%;top:50%;translate:-50% -50%;color:var(--dim);transition:opacity .4s;pointer-events:none;z-index:5}
@media (max-width:899px){
  #patrolBtn{top:58px;right:12px}
  #panel{left:12px;right:12px;top:100px;width:auto;padding:12px 14px;max-height:40vh}
  #total{font-size:26px;margin:0}
  #legend{left:12px;top:auto;bottom:84px;transform:none}
  body.vn #legend{transform:none}
  #legend .g{height:96px}
  #fit{left:12px;top:58px}
  #bar{max-width:calc(100% - 140px);left:12px;translate:0 0;bottom:20px}
  #settingsWrap{right:12px;bottom:20px}
  header{padding:12px}
}

/* Modals (Analytics Calendar/Charts/Region & Method) */
.modal{position:fixed;inset:0;z-index:20;background:rgba(4,9,24,.78);backdrop-filter:blur(10px);display:none;align-items:center;justify-content:center;padding:18px}
.modal.open{display:flex}
.mbox{width:min(1040px,100%);max-height:90vh;background:rgba(10,19,50,.96);border:1px solid rgba(230,213,176,.26);border-radius:18px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 24px 70px rgba(0,0,0,.6)}
.mhead{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.mhead h2{margin:0;font-size:16px;font-weight:500;color:#fff3da}
.mbody{padding:18px;overflow-y:auto;display:flex;flex-direction:column;gap:16px}
.mbody>*{flex-shrink:0}   /* khong cho bieu do/bang bi co chieu cao trong khung cuon */
.mclose{margin-left:auto;width:30px;height:30px;border-radius:50%;border:1px solid var(--line);color:var(--dim)}
.mclose:hover{background:rgba(230,213,176,.14);color:#fff}
.calgrid{display:grid;grid-template-columns:54px repeat(12,minmax(36px,1fr));gap:3px;font-size:11px}
.calcell{height:24px;border-radius:4px;display:flex;align-items:center;justify-content:center;color:#fff;cursor:pointer;position:relative;font-family:"IBM Plex Mono",monospace;font-size:10px}
.calcell:hover{outline:1.5px solid #fff;z-index:2}
.calhdr{color:var(--dim);text-align:center;padding:4px 0;font-size:11px}
.calyr{color:var(--dim);display:flex;align-items:center;font-family:"IBM Plex Mono",monospace;font-size:11px}
.cards3{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
.kcard{padding:12px;border:1px solid var(--line);border-radius:12px;background:rgba(230,213,176,.04)}
.kcard b{display:block;font-size:20px;font-weight:500;color:#fff3da;margin:4px 0 2px}
.kcard span{font-size:12px;color:var(--dim)}
.rform{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;align-items:end}
.rinp{width:100%;height:34px;padding:0 10px;border:1px solid var(--line);border-radius:9px;background:rgba(9,17,44,.8);color:#fff3da;font-size:13px}
.gr button.qA{box-shadow:inset 0 -2px 0 #ff4d4d}
.gr button.qB{box-shadow:inset 0 -2px 0 #f08a34}
.gr button.qD{box-shadow:inset 0 -2px 0 #f2c063}
</style>
<link rel="stylesheet" href="ui/responsive.css"><!-- responsive module: xoá dòng này để về giao diện gốc -->
</head>
<body class="globe">
<canvas id="stars"></canvas>
<canvas id="terrain"></canvas>
<div id="heat"><canvas id="heatA" class="hl on"></canvas><canvas id="heatB" class="hl pre"></canvas></div>
<canvas id="map"></canvas>

<header>
  <button class="pill vnonly" id="back"><span>←</span><span data-i="back"></span></button>
  <div class="brand"><i></i><span data-i="brand"></span></div>
  <button class="pill vnonly" id="anaBtn"><span>📊</span><span data-i="anaBtn"></span></button>
  <button class="pill" id="methBtn"><span>ⓘ</span><span data-i="methBtn"></span></button>
  <div class="grow"></div>
  <div class="seg vnonly" id="styles">
    <button data-s="heat" data-i="sHeat"></button>
    <button data-s="grid" data-i="sGrid"></button>
  </div>
</header>

<button class="pill vnonly" id="patrolBtn"><span>🛡</span><span data-i="patrolBtn"></span></button>

<button class="pill" id="fit"><span>⤺</span><span data-i="fit"></span></button>
<div id="hint"><b data-i="hintT"></b><span data-i="hint"></span></div>
<button id="vnChip"><i></i><span data-i="chip"></span></button>

<aside id="panel" class="vnonly">
  <div id="fireBox">
    <div class="lab" data-i="total"></div>
    <div id="total" class="mono">0</div>
    <div id="period2"></div>
    <div id="top">
      <div class="lab" data-i="top"></div>
      <div id="topRows" style="display:grid;gap:10px"></div>
    </div>
    <button id="topMore" style="display:none"></button>
  </div>
  <div id="patrolBox">
    <div class="lab" data-i="patrolTitle"></div>
    <select id="pProvSel" class="psel"></select>
    <div>
      <div class="lab" style="margin-bottom:6px" data-i="patrolMonth"></div>
      <div class="pmonths" id="pMonths"></div>
    </div>
    <label class="pchk"><input type="checkbox" id="pHardOnly"><span data-i="patrolHardOnly"></span></label>
    <div class="pstats" id="pStats"></div>
    <div id="pEmpty" class="pempty" style="display:none"></div>
    <div id="patrolCard"></div>
  </div>
</aside>

<div id="legend" class="vnonly">
  <div class="lab" id="legTitle" data-i="legend"></div>
  <div class="vwrap">
    <div class="g"></div>
    <div class="vt">
      <div><b class="mono" id="lmax"></b><span data-i="high"></span></div>
      <div><b class="mono">0</b><span data-i="low"></span></div>
    </div>
  </div>
  <div class="pleg">
    <div><i style="background:#e22b2b"></i><span data-i="pHigh"></span></div>
    <div><i style="background:#f08a34"></i><span data-i="pMed"></span></div>
    <div><i style="background:#f2c063"></i><span data-i="pLow"></span></div>
  </div>
</div>

<div id="bar" class="vnonly">
  <div class="seg" id="modes">
    <button data-m="day" data-i="mDay"></button>
    <button data-m="month" data-i="mMonth"></button>
    <button data-m="quarter" data-i="mQuarter"></button>
    <button data-m="year" data-i="mYear"></button>
  </div>
  <div class="stepper">
    <button class="ar" id="prev" aria-label="prev">‹</button>
    <button id="plabel"><span id="ptext"></span><u>▲</u></button>
    <button class="ar" id="next" aria-label="next">›</button>
  </div>
  <div id="picker"></div>
</div>

<div id="settingsWrap">
  <div id="settingsPop">
    <div class="setGrp">
      <div class="lab" data-i="setLang"></div>
      <div class="seg" id="langs"><button data-l="vi">Tiếng Việt</button><button data-l="en">English</button></div>
    </div>
    <div class="setGrp">
      <div class="lab" data-i="setTheme"></div>
      <div class="seg" id="themes"><button data-th="glass" data-i="thGlass"></button><button data-th="terrain" data-i="thTerrain"></button></div>
    </div>
    <div class="setGrp">
      <div class="lab" data-i="setPalette"></div>
      <div class="seg" id="palettes"><button data-pal="fire" data-i="palFire"></button><button data-pal="cb" data-i="palCb"></button></div>
    </div>
    <div class="setGrp">
      <div class="lab" data-i="setView"></div>
      <div class="seg" id="views"><button data-vw="globe" data-i="vwGlobe"></button><button data-vw="vn" data-i="vwVn"></button></div>
    </div>
  </div>
  <button class="pill" id="settingsBtn"><span>⚙</span><span data-i="settings"></span></button>
</div>


<div id="anaModal" class="modal">
  <div class="mbox">
    <div class="mhead">
      <h2 data-i="anaTitle"></h2>
      <div class="seg" id="anaTabs">
        <button class="act" data-tab="cal" data-i="tabCal"></button>
        <button data-tab="chart" data-i="tabChart"></button>
        <button data-tab="reg" data-i="tabReg"></button>
      </div>
      <select id="anaProv" class="psel" style="width:190px;height:32px"></select>
      <button class="mclose" id="anaClose">✕</button>
    </div>
    <div class="mbody" id="anaBody"></div>
  </div>

    vm.map(r=>[MN[r.model],nf(r.o_poisson_deviance,2),nf(r.o_R2_log1p,3),nf(r.o_spearman_median,3),pc(r['qg_bias_%']),nf(r['qg_MAPE_%'])+'%',nf(r.lich_spearman_thang_tb,3)])):'';
  const dr=(METHOD?.validation_models||[]).find(r=>/DRIFT/.test(r.model));
  // 2) tach theo vung / mua
  const SN={D:vi?'D (đang dùng)':'D (in use)','D+region':vi?'D + hệ số riêng 6 vùng sinh thái':'D + 6 eco-region slopes','D+season':vi?'D + hệ số riêng mùa khô/mưa':'D + dry/wet season slopes','D+region+season':vi?'D + vùng + mùa':'D + region + season'};
  const sr=(EVID.stratified||[]),st=sr.filter(r=>r.tap==='test_2018_2021'),sd=k=>sr.find(r=>r.tap==='drift_2022+'&&r.model===k);
  const t2=st.length?tbl([vi?'Biến thể':'Variant',vi?'Deviance ô ↓':'Cell deviance ↓','R² log ô',vi?'Bias test':'Test bias',vi?'Spearman lịch':'Calendar Spearman',vi?'Bias 2022+':'2022+ bias'],
    st.map(r=>[SN[r.model]||r.model,nf(r.o_poisson_deviance,3),nf(r.o_R2_log1p,3),pc(r['qg_bias_%']),nf(r.lich_spearman_thang_tb,3),pc(sd(r.model)?.['qg_bias_%'])])):'';
  const d0=st.find(r=>r.model==='D'),dB=st.reduce((a,r)=>r.o_poisson_deviance<a.o_poisson_deviance?r:a,st[0]||{});
  const gain=d0&&dB?(1-dB.o_poisson_deviance/d0.o_poisson_deviance)*100:NaN;
  const rb=d0?['dong_nam_bo','dbsh','tay_nguyen','dbscl'].map(k=>`${({dong_nam_bo:vi?'Đông Nam Bộ':'Southeast',dbsh:vi?'ĐB sông Hồng':'Red River Delta',tay_nguyen:vi?'Tây Nguyên':'Central Highlands',dbscl:vi?'ĐBSCL':'Mekong Delta'})[k]} ${pc(d0[`bias_${k}_%`])}`).join(', '):'';
  // 3) back-test nguon tinh
  const bt=(EVID.static_backtest||[]),bA=bt.find(r=>r.quy_tac==='A_hoac_B'&&r.cam_bien==='ALL'),bM=bt.find(r=>r.quy_tac==='A_hoac_B'&&r.cam_bien==='MODIS'),bV=bt.find(r=>r.quy_tac==='A_hoac_B'&&r.cam_bien==='VIIRS');
  const t3=bt.length?tbl([vi?'Quy tắc':'Rule',vi?'Cảm biến':'Sensor',vi?'Bắt được nguồn tĩnh ↑':'Static caught ↑',vi?'Loại nhầm cháy thật ↓':'Real fires removed ↓',vi?'Số điểm tĩnh':'Static pts'],
    bt.filter(r=>r.cam_bien==='ALL'||r.quy_tac==='A_hoac_B').map(r=>[({A_nhan_NASA_100m:vi?'A. Nhãn NASA, ô 100 m':'A. NASA label, 100 m',B_lien_tuc_1km:vi?'B. Cháy liên tục, ô 1 km':'B. Persistent, 1 km',A_hoac_B:vi?'<b>A hoặc B (đang dùng)</b>':'<b>A or B (in use)</b>'})[r.quy_tac],r.cam_bien,nf(r['recall_%'])+'%',nf(r['loai_nham_chay_that_%'],2)+'%',fmt(r.n_type2)])):'';
  const h=META||{}, fs=h.filter_stats||{};
  $('#methBody').innerHTML=vi?`
    <p><b>1. Vì sao phải hài hòa.</b> Pixel VIIRS 375 m so với MODIS ~1 km: VIIRS thấy đám cháy nhỏ hơn và một đám cháy có thể thành nhiều điểm. Giờ bay và số vệ tinh cũng khác. Ghép thẳng hai chuỗi thì số điểm nhảy vọt giả tạo từ 2012 (xem tab <i>Biểu đồ chuỗi</i>).</p>
    <p><b>2. Thang chuẩn và cảm biến.</b> Đích là <b>một vệ tinh VIIRS S-NPP</b> (không cộng 3 vệ tinh VIIRS vì sẽ đếm trùng và tạo bậc thang khi NOAA-20/21 lên quỹ đạo). Nguồn lịch sử là <b>MODIS-Aqua</b> vì bay ~13:30, cùng giờ S-NPP; Terra bị loại vì tỉ lệ Terra/VIIRS trôi từ ~16 xuống ~7,5. Từ 11/2026 FIRMS ngừng S-NPP nên dùng NOAA-20 × <b>${nf(h.noaa20_to_snpp_factor,3)}</b>.</p>
    <p><b>3. Tiền xử lý.</b> Bỏ điểm độ tin cậy thấp ở cả hai cảm biến (MODIS &lt; 30, VIIRS “l”: ${fmt(fs.bo_do_tin_cay_thap||0)} điểm), bỏ điểm trùng, đổi giờ UTC → giờ Việt Nam, rồi lọc nguồn nhiệt tĩnh (mục 6). Gộp lưới <b>0,25° × tháng</b> để học quy đổi.</p>
    <p><b>4. Mô hình quy đổi.</b> <code>log E[VIIRS] = a + b₁·log(M+1) + b₂·[M&gt;0] + b₃·log(M_lân cận+1) + hệ số riêng từng ô</code>, M là số điểm MODIS-Aqua. Học trên <b>2012–2017</b>, kiểm tra trên <b>2018–2021</b> (mô hình chưa thấy), fit cuối 2012–2021 rồi áp cho 2003–2011. So sánh trên tập kiểm tra:</p>${t1}
    <p style="color:var(--dim);font-size:12px">Ở mức cả nước, mô hình đơn giản cũng khá tốt (MAPE ~16%). GLM thắng rõ ở <b>mức ô</b> (deviance giảm ~9 lần), đó là mức cần cho chọn vùng và bản đồ. Kiểm tra riêng 2022+ cho bias <b>${pc(dr?.['qg_bias_%'])}</b> do Aqua trôi quỹ đạo, nên giai đoạn đó dùng VIIRS đo thật, không dùng dự đoán.</p>
    <p><b>5. Có cần tách theo lớp phủ / vùng / mùa?</b> Chưa có dữ liệu lớp phủ thật (MCD12Q1) trong dự án, nên chúng tôi kiểm tra bằng đại diện: <b>6 vùng sinh thái</b> (ĐBSCL ~ đốt rơm rạ, Tây Nguyên và miền núi phía Bắc ~ rừng và nương rẫy…) và <b>mùa khô/mưa</b>, cho hệ số quy đổi đổi theo nhóm, cùng tập kiểm tra:</p>${t2}
    <p style="color:var(--dim);font-size:12px">Tách nhóm chỉ giảm deviance ~${nf(gain,0)}%, bias gần như không đổi và Spearman lịch còn giảm nhẹ. Hệ số riêng từng ô 0,25° đã hấp thụ gần hết khác biệt theo lớp phủ, nên giữ mô hình D (ít tham số hơn). Sai lệch theo vùng còn lại trên tập test: ${rb}. Thêm lớp phủ thật là hướng phát triển tiếp.</p>
    <p><b>6. Lọc nguồn nhiệt tĩnh</b> (nhà máy, lò, bãi rác…) áp cùng một quy tắc cho dữ liệu archive và NRT: bỏ nhãn NASA <code>type 1/2/3</code>; (A) ô 100 m có ≥ 50% điểm type 2, nới 5×5 (~500 m); (B) ô 1 km cháy liên tục ≥ 8 tháng trong năm, lặp ≥ 3 năm. <b>Back-test:</b> xây mặt nạ chỉ từ dữ liệu đến 2023, che nhãn của dữ liệu 2024+ rồi so với nhãn NASA:</p>${t3}
    <p style="color:var(--dim);font-size:12px">Bộ lọc bắt <b>${nf(bA?.['recall_%'])}%</b> điểm nguồn tĩnh (VIIRS ${nf(bV?.['recall_%'])}%, MODIS ${nf(bM?.['recall_%'])}% vì pixel 1 km khó khoanh nhà máy) và chỉ loại nhầm <b>${nf(bA?.['loai_nham_chay_that_%'],2)}%</b> điểm cháy thật.</p>
    <p><b>7. Khoảng tin cậy.</b> 90%, kiểm chứng chéo bỏ-một-năm trên 9 năm (theo năm ${pc((Math.exp(h.ci90_log_ratio_yearly_loyo?.[0]||0)-1)*100)} → ${pc((Math.exp(h.ci90_log_ratio_yearly_loyo?.[1]||0)-1)*100)}); chỉ áp cho số ước tính từ MODIS (2003–01/2012). Số từ 2012 là VIIRS đo thật.</p>
    <p><b>8. Ngày S-NPP mất dữ liệu (đã bù).</b> S-NPP có nhiều đợt ngừng hoặc bị ẩn dữ liệu do sự cố vệ tinh (chế độ an toàn, lỗi GPS), ví dụ 26/7–10/8/2022, 9–16/7 và 24–31/7/2024, 9–13/3, 28–30/4 và 10–16/7/2026, theo thông báo của NOAA/NASA; từ 02/11/2026 S-NPP ngừng hẳn. Mỗi lượt bay (ngày giờ VN × ngày/đêm) mà S-NPP = 0 trong khi NOAA-20/21 vẫn thấy cháy, hoặc nằm trong đợt sự cố đã công bố, được <b>bù bằng NOAA-20 × ${nf(h.noaa20_to_snpp_factor,3)}</b> (cùng cảm biến VIIRS, cùng quỹ đạo, bay sau ~50 phút; NOAA-21 nếu NOAA-20 trống; trước 2018 dùng Aqua × tỷ lệ của tháng). Hệ số học trên các lượt bay không bị mất. Đã bù <b>${nf(h.snpp_gap_fill?.passes,0)} lượt bay</b> (~<b>${nf(h.snpp_gap_fill?.filled_points,0)} điểm</b>); các ngày này được đánh dấu trên lịch chọn ngày. Số của ngày được bù là ước tính, không phải S-NPP đo trực tiếp.</p>
    <p><b>9. Hạn chế khác.</b> 14/34 tỉnh ít cháy chưa đạt ngưỡng kiểm chứng riêng (cảnh báo khi xem 2003–2011); khoảng tin cậy năm chỉ từ 9 năm; ~9% giá trị 2003–2011 nằm ở ô MODIS = 0 (dự đoán từ ô lân cận) nên không gắn được vào điểm cụ thể; điểm sát biên giới gán về tỉnh gần nhất; tháng 11/2026 mới có dữ liệu đến <b>${h.data_last_local_date||'–'}</b>.</p>
    <p style="color:var(--dim)"><b>Nguồn dữ liệu:</b> NASA FIRMS (MODIS Collection 6.1, VIIRS Collection 2 S-NPP / NOAA-20 / NOAA-21), ranh giới 34 tỉnh theo Nghị quyết 202/2025/QH15, OpenStreetMap, NASADEM. Mã tái lập: <code>harmonize.py</code>, <code>test_phan_tang_glm.py</code>, <code>backtest_nguon_tinh.py</code>, <code>export_evidence.py</code>.</p>
  `:`
    <p><b>1. Why harmonize.</b> VIIRS pixels are 375 m vs ~1 km for MODIS: VIIRS sees smaller fires and one fire can become several points; overpass times and the number of satellites differ too. Splicing the two series naively creates an artificial jump in 2012 (see the <i>Series</i> tab).</p>
    <p><b>2. Reference scale and sensors.</b> Target is <b>one VIIRS satellite, S-NPP</b> (summing the three VIIRS satellites would double-count fires and add steps when NOAA-20/21 launched). History comes from <b>MODIS-Aqua</b> (~13:30 overpass, same as S-NPP); Terra is excluded because its ratio to VIIRS drifts from ~16 to ~7.5. FIRMS stopped S-NPP in Nov 2026, so NOAA-20 × <b>${nf(h.noaa20_to_snpp_factor,3)}</b> continues the series.</p>
    <p><b>3. Pre-processing.</b> Low-confidence detections removed for both sensors (MODIS &lt; 30, VIIRS “l”: ${fmt(fs.bo_do_tin_cay_thap||0)} points), duplicates removed, UTC → Vietnam time, static heat sources filtered (item 6). Aggregated to a <b>0.25° × month</b> grid to learn the conversion.</p>
    <p><b>4. Conversion model.</b> <code>log E[VIIRS] = a + b₁·log(M+1) + b₂·[M&gt;0] + b₃·log(M_neighbours+1) + per-cell effect</code>, M = MODIS-Aqua count. Trained on <b>2012–2017</b>, tested on unseen <b>2018–2021</b>, final fit 2012–2021 applied to 2003–2011. Test-set comparison:</p>${t1}
    <p style="color:var(--dim);font-size:12px">Nationally a simple ratio is already decent (MAPE ~16%); the GLM wins clearly at <b>cell level</b> (deviance ~9× lower), which is what region selection and the map need. A separate 2022+ check gives bias <b>${pc(dr?.['qg_bias_%'])}</b> from Aqua orbit drift, so that period uses observed VIIRS, not predictions.</p>
    <p><b>5. Stratify by land cover / region / season?</b> No real land-cover layer (MCD12Q1) is available in this project, so we tested proxies: <b>6 eco-regions</b> (Mekong Delta ~ rice-straw burning, Highlands and northern mountains ~ forest and shifting cultivation…) and <b>dry/wet season</b>, letting the conversion slopes vary by group, on the same test set:</p>${t2}
    <p style="color:var(--dim);font-size:12px">Stratification lowers deviance by only ~${nf(gain,0)}%, bias is unchanged and calendar Spearman drops slightly. The per-cell 0.25° effects already absorb most land-cover differences, so model D (fewer parameters) is kept. Remaining regional test bias: ${rb}. Adding real land cover is future work.</p>
    <p><b>6. Static heat-source filter</b> (factories, kilns, landfills…), same rule for archive and NRT: drop NASA <code>type 1/2/3</code>; (A) 100 m cells with ≥ 50% type-2 points, dilated 5×5 (~500 m); (B) 1 km cells burning ≥ 8 consecutive months in a year for ≥ 3 years. <b>Back-test:</b> masks built from data up to 2023 only, labels hidden for 2024+ and compared with NASA labels:</p>${t3}
    <p style="color:var(--dim);font-size:12px">The filter catches <b>${nf(bA?.['recall_%'])}%</b> of static points (VIIRS ${nf(bV?.['recall_%'])}%, MODIS ${nf(bM?.['recall_%'])}% — 1 km pixels are hard to delineate) while removing only <b>${nf(bA?.['loai_nham_chay_that_%'],2)}%</b> of real fires.</p>
    <p><b>7. Uncertainty.</b> 90% intervals from leave-one-year-out over 9 years (yearly ${pc((Math.exp(h.ci90_log_ratio_yearly_loyo?.[0]||0)-1)*100)} → ${pc((Math.exp(h.ci90_log_ratio_yearly_loyo?.[1]||0)-1)*100)}), applied only to MODIS-derived values (2003–Jan 2012). From 2012 values are observed VIIRS.</p>
    <p><b>8. S-NPP outage days (gap-filled).</b> S-NPP had several outages or hidden data due to spacecraft anomalies (safe mode, GPS errors), e.g. 26 Jul–10 Aug 2022, 9–16 and 24–31 Jul 2024, 9–13 Mar, 28–30 Apr and 10–16 Jul 2026, per NOAA/NASA notices; S-NPP ended on 2 Nov 2026. Each overpass (local date × day/night) where S-NPP = 0 while NOAA-20/21 still detect fires, or that falls inside a published outage, is <b>filled with NOAA-20 × ${nf(h.noaa20_to_snpp_factor,3)}</b> (same VIIRS sensor and orbit, ~50 min apart; NOAA-21 if NOAA-20 is empty; Aqua × monthly ratio before 2018). The factor is learned on non-outage overpasses. Filled <b>${nf(h.snpp_gap_fill?.passes,0)} overpasses</b> (~<b>${nf(h.snpp_gap_fill?.filled_points,0)} pts</b>); these days are flagged in the day picker. Values on filled days are estimates, not direct S-NPP observations.</p>
    <p><b>9. Other limitations.</b> 14/34 low-fire provinces are below their own validation threshold (warning shown for 2003–2011); yearly CIs rest on 9 years; ~9% of 2003–2011 values sit in cells with MODIS = 0 (predicted from neighbours) and cannot be tied to points; border points go to the nearest province; Nov 2026 is partial through <b>${h.data_last_local_date||'–'}</b>.</p>
    <p style="color:var(--dim)"><b>Sources:</b> NASA FIRMS (MODIS C6.1, VIIRS C2 S-NPP / NOAA-20 / NOAA-21), 34-province boundaries (Resolution 202/2025/QH15), OpenStreetMap, NASADEM. Reproducible code: <code>harmonize.py</code>, <code>test_phan_tang_glm.py</code>, <code>backtest_nguon_tinh.py</code>, <code>export_evidence.py</code>.</p>
  `;
}
